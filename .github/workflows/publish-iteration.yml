name: Publish Iteration

on:
  workflow_dispatch:
    inputs:
      milestone_number:
        description: GitHub milestone number to publish
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  request-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read milestone
        id: milestone
        uses: actions/github-script@v7
        env:
          MILESTONE_NUMBER: ${{ inputs.milestone_number }}
        with:
          script: |
            const number = Number(process.env.MILESTONE_NUMBER);
            const milestone = (await github.rest.issues.getMilestone({ ...context.repo, milestone_number: number })).data;
            const slug = milestone.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || `iteration-${number}`;
            core.setOutput('title', milestone.title);
            core.setOutput('branch', `iteration/${slug}`);
      - name: Wake Release Waker
        env:
          QW_API_URL: ${{ secrets.QW_RELEASE_WEBHOOK }}
          QW_ROLE: release
          QW_EVENT_TYPE: iteration.publish-requested
          QW_SESSION_ENTITY: milestone:${{ inputs.milestone_number }}
          QW_CONTEXT_JSON: >-
            {"milestoneNumber":${{ inputs.milestone_number }},"iterationName":${{ toJSON(steps.milestone.outputs.title) }},"iterationBranch":${{ toJSON(steps.milestone.outputs.branch) }}}
        run: node .github/scripts/invoke-waker.mjs
