name: EATP Event Router

on:
  issues:
    types: [opened, labeled, reopened]
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

jobs:
  developer:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'phase:dev' &&
      contains(github.event.issue.labels.*.name, 'type:batch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake Developer Waker
        env:
          QW_API_URL: ${{ secrets.QW_DEVELOPER_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_ROLE: developer
          QW_EVENT_TYPE: batch.phase-dev
          QW_SESSION_ENTITY: batch:${{ github.event.issue.number }}
          QW_CONTEXT_JSON: >-
            {"batchIssueNumber":${{ github.event.issue.number }},"issueUrl":${{ toJSON(github.event.issue.html_url) }},"milestoneNumber":${{ github.event.issue.milestone.number }}}
        run: node .github/scripts/invoke-waker.mjs

  tester:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'phase:test' &&
      contains(github.event.issue.labels.*.name, 'type:batch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake Tester Waker
        env:
          QW_API_URL: ${{ secrets.QW_TESTER_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_ROLE: tester
          QW_EVENT_TYPE: batch.phase-test
          QW_SESSION_ENTITY: batch:${{ github.event.issue.number }}
          QW_CONTEXT_JSON: >-
            {"batchIssueNumber":${{ github.event.issue.number }},"issueUrl":${{ toJSON(github.event.issue.html_url) }},"milestoneNumber":${{ github.event.issue.milestone.number }}}
        run: node .github/scripts/invoke-waker.mjs

  orchestrator-bug-state:
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'type:bug') &&
      ((github.event.action == 'opened' &&
        (contains(github.event.issue.labels.*.name, 'eatp:L0') ||
         contains(github.event.issue.labels.*.name, 'eatp:L1'))) ||
       (github.event.action == 'labeled' &&
        (github.event.label.name == 'eatp:L0' ||
         github.event.label.name == 'eatp:L1')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake Orchestrator Waker for item state
        env:
          QW_API_URL: ${{ secrets.QW_ORCHESTRATOR_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_ROLE: orchestrator
          QW_EVENT_TYPE: item.state-changed
          QW_SESSION_ENTITY: item:${{ github.event.issue.number }}
          QW_CONTEXT_JSON: >-
            {"itemIssueNumber":${{ github.event.issue.number }},"itemUrl":${{ toJSON(github.event.issue.html_url) }},"action":${{ toJSON(github.event.action) }},"labels":${{ toJSON(github.event.issue.labels.*.name) }}}
        run: node .github/scripts/invoke-waker.mjs

  orchestrator-requirement-passed:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      contains(github.event.issue.labels.*.name, 'type:requirement') &&
      github.event.label.name == 'eatp:L2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake Orchestrator Waker for completed test aggregation
        env:
          QW_API_URL: ${{ secrets.QW_ORCHESTRATOR_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_ROLE: orchestrator
          QW_EVENT_TYPE: item.state-changed
          QW_SESSION_ENTITY: requirement:${{ github.event.issue.number }}
          QW_CONTEXT_JSON: >-
            {"itemIssueNumber":${{ github.event.issue.number }},"itemUrl":${{ toJSON(github.event.issue.html_url) }},"action":${{ toJSON(github.event.action) }},"labels":${{ toJSON(github.event.issue.labels.*.name) }}}
        run: node .github/scripts/invoke-waker.mjs

  orchestrator-user-decision:
    if: >-
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      (github.event.label.name == 'decision:pass' ||
       github.event.label.name == 'decision:reject' ||
       github.event.label.name == 'decision:remove')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake Orchestrator Waker for user decision
        env:
          QW_API_URL: ${{ secrets.QW_ORCHESTRATOR_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_ROLE: orchestrator
          QW_EVENT_TYPE: user.decision
          QW_SESSION_ENTITY: item:${{ github.event.issue.number }}
          QW_CONTEXT_JSON: >-
            {"itemIssueNumber":${{ github.event.issue.number }},"itemUrl":${{ toJSON(github.event.issue.html_url) }},"decision":${{ toJSON(github.event.label.name) }}}
        run: node .github/scripts/invoke-waker.mjs

  orchestrator-dev-merged:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.base.ref, 'iteration/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake Orchestrator Waker after deployment merge
        env:
          QW_API_URL: ${{ secrets.QW_ORCHESTRATOR_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_ROLE: orchestrator
          QW_EVENT_TYPE: dev.merged
          QW_SESSION_ENTITY: pr:${{ github.event.pull_request.number }}
          QW_CONTEXT_JSON: >-
            {"pullNumber":${{ github.event.pull_request.number }},"pullUrl":${{ toJSON(github.event.pull_request.html_url) }},"mergeSha":${{ toJSON(github.event.pull_request.merge_commit_sha) }},"iterationBranch":${{ toJSON(github.event.pull_request.base.ref) }}}
        run: node .github/scripts/invoke-waker.mjs
