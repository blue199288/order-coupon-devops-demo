name: Demo Flow Event Router

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: Existing Demo pull request number to route after recovery
        required: true
        type: string
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

jobs:
  developer:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.milestone != null &&
      contains(github.event.issue.labels.*.name, 'flow:demo') &&
      contains(github.event.issue.labels.*.name, 'status:ready-dev') &&
      github.event.action == 'labeled' &&
      (github.event.label.name == 'status:ready-dev' ||
       github.event.label.name == 'flow:demo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake Demo Developer Waker
        env:
          QW_API_URL: ${{ secrets.QW_DEMO_DEVELOPER_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_FLOW: demo
          QW_ROLE: developer
          QW_EVENT_TYPE: issue.ready-for-development
          QW_SESSION_ENTITY: issue:${{ github.event.issue.number }}
          QW_CONTEXT_JSON: >-
            {"issueNumber":${{ github.event.issue.number }},"issueUrl":${{ toJSON(github.event.issue.html_url) }},"milestoneNumber":${{ github.event.issue.milestone.number }},"milestoneTitle":${{ toJSON(github.event.issue.milestone.title) }},"action":${{ toJSON(github.event.action) }}}
        run: node .github/scripts/invoke-waker.mjs

  reviewer:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action != 'closed' &&
       github.event.pull_request.draft == false &&
       (startsWith(github.event.pull_request.head.ref, 'demo/') ||
        contains(github.event.pull_request.body, '[QW-DEMO][DEV][READY]')) &&
       startsWith(github.event.pull_request.base.ref, 'iteration/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Demo pull request
        id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PULL_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          pull_number="$EVENT_PULL_NUMBER"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then pull_number="$INPUT_PULL_NUMBER"; fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_number}" > "$RUNNER_TEMP/demo-pr.json"
          echo "number=$(jq -r '.number' "$RUNNER_TEMP/demo-pr.json")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.html_url' "$RUNNER_TEMP/demo-pr.json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/demo-pr.json")" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq -r '.head.ref' "$RUNNER_TEMP/demo-pr.json")" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(jq -r '.base.ref' "$RUNNER_TEMP/demo-pr.json")" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.draft' "$RUNNER_TEMP/demo-pr.json")" = "true" ] || ! jq -e '.base.ref | startswith("iteration/")' "$RUNNER_TEMP/demo-pr.json" >/dev/null || ! jq -e '(.head.ref | startswith("demo/")) or (.body // "" | contains("[QW-DEMO][DEV][READY]"))' "$RUNNER_TEMP/demo-pr.json" >/dev/null; then
            echo "The selected pull request is not a ready Demo delivery" >&2
            exit 1
          fi
      - name: Wake Demo Reviewer Waker
        env:
          QW_API_URL: ${{ secrets.QW_DEMO_REVIEWER_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_FLOW: demo
          QW_ROLE: reviewer
          QW_EVENT_TYPE: pull-request.content-revision
          QW_SESSION_ENTITY: pr:${{ steps.pull.outputs.number }}:sha:${{ steps.pull.outputs.head_sha }}
          QW_CONTEXT_JSON: >-
            {"pullNumber":${{ steps.pull.outputs.number }},"pullUrl":${{ toJSON(steps.pull.outputs.url) }},"action":${{ toJSON(github.event.action || 'recovery') }},"headSha":${{ toJSON(steps.pull.outputs.head_sha) }},"headRef":${{ toJSON(steps.pull.outputs.head_ref) }},"baseRef":${{ toJSON(steps.pull.outputs.base_ref) }}}
        run: node .github/scripts/invoke-waker.mjs

  tester:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'demo/') ||
       contains(github.event.pull_request.body, '[QW-DEMO][DEV][READY]')) &&
      startsWith(github.event.pull_request.base.ref, 'iteration/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake Demo Tester Waker
        env:
          QW_API_URL: ${{ secrets.QW_DEMO_TESTER_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_FLOW: demo
          QW_ROLE: tester
          QW_EVENT_TYPE: pull-request.merged-to-iteration
          QW_SESSION_ENTITY: pr:${{ github.event.pull_request.number }}:sha:${{ github.event.pull_request.merge_commit_sha }}
          QW_CONTEXT_JSON: >-
            {"pullNumber":${{ github.event.pull_request.number }},"pullUrl":${{ toJSON(github.event.pull_request.html_url) }},"mergeSha":${{ toJSON(github.event.pull_request.merge_commit_sha) }},"headRef":${{ toJSON(github.event.pull_request.head.ref) }},"iterationBranch":${{ toJSON(github.event.pull_request.base.ref) }}}
        run: node .github/scripts/invoke-waker.mjs

  release-finalize:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'iteration/') &&
      contains(github.event.pull_request.body, '[QW-DEMO][RELEASE]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wake Demo Release Waker after main merge
        env:
          QW_API_URL: ${{ secrets.QW_DEMO_RELEASE_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_FLOW: demo
          QW_ROLE: release
          QW_EVENT_TYPE: iteration.merged-to-main
          QW_SESSION_ENTITY: pr:${{ github.event.pull_request.number }}:sha:${{ github.event.pull_request.merge_commit_sha }}
          QW_CONTEXT_JSON: >-
            {"pullNumber":${{ github.event.pull_request.number }},"mergeSha":${{ toJSON(github.event.pull_request.merge_commit_sha) }},"iterationBranch":${{ toJSON(github.event.pull_request.head.ref) }}}
        run: node .github/scripts/invoke-waker.mjs
