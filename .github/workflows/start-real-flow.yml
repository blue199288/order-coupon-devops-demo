name: Start Real EATP Flow

on:
  workflow_dispatch:
    inputs:
      iteration:
        description: Iteration / Milestone name
        required: true
        default: Iteration-Real
      requirement:
        description: Requirement or regression scope
        required: true
        default: Add BULK25 coupon for large orders
      mode:
        description: EATP run mode
        required: true
        default: iteration
        type: choice
        options: [iteration, regression]
      failure_mode:
        description: Demo injection path; pass means no simulated defect
        required: true
        default: code-defect-once
        type: choice
        options: [code-defect-once, wait-user-once, pass]

permissions:
  contents: read
  issues: write

jobs:
  initialize-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create iteration, batch and requirement
        id: bootstrap
        uses: actions/github-script@v7
        env:
          ITERATION: ${{ inputs.iteration }}
          REQUIREMENT: ${{ inputs.requirement }}
          MODE: ${{ inputs.mode }}
          FAILURE_MODE: ${{ inputs.failure_mode }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const iteration = process.env.ITERATION.trim();
            const milestones = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'all' });
            const duplicate = milestones.find(item => item.title === iteration);
            if (duplicate) {
              core.setFailed(`Iteration name already exists: ${iteration}. Start a new run with a unique suffix.`);
              return;
            }
            const milestone = (await github.rest.issues.createMilestone({ owner, repo, title: iteration })).data;

            const requirementBody = [
              '## EATP input', '', `Mode: ${process.env.MODE}`, 'Batch: pending', '',
              '## Business requirement / regression scope', '', process.env.REQUIREMENT, '',
              'Implement or verify coupon `BULK25`:',
              '- Available when order amount is at least 1000.',
              '- Discount is 25% of order amount.',
              '- Keep existing coupon behavior compatible.', '',
              '## Acceptance criteria', '',
              '- `BULK25` gives no discount below 1000.',
              '- `BULK25` gives 25% off at and above 1000.',
              '- `npm test` and `npm run lint` pass.',
            ].join('\n');
            const requirement = (await github.rest.issues.create({
              owner, repo, title: process.env.REQUIREMENT, body: requirementBody,
              milestone: milestone.number, labels: ['flow:real', 'type:requirement', 'eatp:L3'],
            })).data;

            const batchBody = [
              '## EATP batch_meta', '', `Iteration: ${iteration}`, `Mode: ${process.env.MODE}`,
              `Failure mode: ${process.env.FAILURE_MODE}`, 'Round: 0', `Requirement: #${requirement.number}`, '',
              '## Assets', '',
              '- Test cases: repository `test/` (POC prebuilt input)',
              '- Test scripts: Node.js test suite (POC prebuilt input)',
              '- Result output: Issue evidence + classified Bug Issues',
            ].join('\n');
            const batch = (await github.rest.issues.create({
              owner, repo, title: `[Batch B${String(milestone.number).padStart(3, '0')}] ${iteration}`,
              body: batchBody, milestone: milestone.number,
              labels: ['flow:real', 'type:batch', 'phase:init', `mode:${process.env.MODE}`, `demo:${process.env.FAILURE_MODE}`],
            })).data;
            await github.rest.issues.update({
              owner, repo, issue_number: requirement.number,
              body: requirementBody.replace('Batch: pending', `Batch: #${batch.number}`),
            });

            const slug = iteration.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || `iteration-${milestone.number}`;
            core.setOutput('milestone_number', String(milestone.number));
            core.setOutput('batch_number', String(batch.number));
            core.setOutput('requirement_number', String(requirement.number));
            core.setOutput('iteration_branch', `iteration/${slug}`);
      - name: Wake Real Orchestrator Waker
        env:
          QW_API_URL: ${{ secrets.QW_REAL_ORCHESTRATOR_WEBHOOK }}
          QODER_PAT: ${{ secrets.QODER_PAT }}
          QW_FLOW: real
          QW_ROLE: orchestrator
          QW_EVENT_TYPE: batch.created
          QW_SESSION_ENTITY: batch:${{ steps.bootstrap.outputs.batch_number }}
          QW_CONTEXT_JSON: >-
            {"milestoneNumber":${{ steps.bootstrap.outputs.milestone_number }},"batchIssueNumber":${{ steps.bootstrap.outputs.batch_number }},"requirementIssueNumber":${{ steps.bootstrap.outputs.requirement_number }},"mode":${{ toJSON(inputs.mode) }},"iterationName":${{ toJSON(inputs.iteration) }},"iterationBranch":${{ toJSON(steps.bootstrap.outputs.iteration_branch) }}}
        run: node .github/scripts/invoke-waker.mjs
