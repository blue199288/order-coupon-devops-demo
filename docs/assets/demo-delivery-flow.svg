<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">QoderWake 与 GitHub 完整研发交付流程</title>
  <desc id="desc">Release、Developer、Reviewer 和 Tester 四个 Waker 围绕 GitHub 事件协作，并保留代码和发布两个人工合并门禁。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F4FF"/><stop offset="1" stop-color="#F3F8FF"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B3FD5"/><stop offset="1" stop-color="#7658ED"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2C2250" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#746C8C"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#6B4FE0"/></marker>
  </defs>
  <rect width="1600" height="720" rx="32" fill="url(#bg)"/>
  <text x="80" y="78" font-family="Arial,'PingFang SC',sans-serif" font-size="36" font-weight="700" fill="#201A36">一条需求，四位 Waker，一次完整交付</text>
  <text x="80" y="118" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#6E6880">事件自动唤醒 Waker，代码合并与正式发布保留人工决策</text>

  <g filter="url(#shadow)">
    <rect x="80" y="180" width="230" height="150" rx="24" fill="#FFFFFF"/>
    <circle cx="125" cy="225" r="22" fill="#EFEAFF"/><text x="125" y="233" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#6548D8">1</text>
    <text x="160" y="232" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#201A36">迭代启动</text>
    <text x="110" y="278" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#5F5970">Release Waker</text>
    <text x="110" y="307" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#5F5970">创建 iteration 分支</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="390" y="180" width="230" height="150" rx="24" fill="#FFFFFF"/>
    <circle cx="435" cy="225" r="22" fill="#E8F3FF"/><text x="435" y="233" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#2563C8">2</text>
    <text x="470" y="232" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#201A36">需求开发</text>
    <text x="420" y="278" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#5F5970">Developer Waker</text>
    <text x="420" y="307" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#5F5970">编码、自测、创建 PR</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="700" y="180" width="230" height="150" rx="24" fill="#FFFFFF"/>
    <circle cx="745" cy="225" r="22" fill="#E9F8EF"/><text x="745" y="233" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#238354">3</text>
    <text x="780" y="232" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#201A36">独立评审</text>
    <text x="730" y="278" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#5F5970">Reviewer Waker</text>
    <text x="730" y="307" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#5F5970">按 head SHA 输出结论</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1010" y="180" width="230" height="150" rx="24" fill="#FFFFFF" stroke="#F2B84B" stroke-width="3"/>
    <circle cx="1055" cy="225" r="22" fill="#FFF3D7"/><text x="1055" y="233" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#A56600">4</text>
    <text x="1090" y="232" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#201A36">人工合并</text>
    <text x="1040" y="278" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#5F5970">CI + Review 均通过</text>
    <text x="1040" y="307" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#5F5970">用户确认 Merge</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1290" y="180" width="230" height="150" rx="24" fill="#FFFFFF"/>
    <circle cx="1335" cy="225" r="22" fill="#FFECEC"/><text x="1335" y="233" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#C23D3D">5</text>
    <text x="1370" y="232" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#201A36">独立测试</text>
    <text x="1320" y="278" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#5F5970">Tester Waker</text>
    <text x="1320" y="307" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#5F5970">验收通过或创建 Bug</text>
  </g>

  <path d="M310 255H378" stroke="#746C8C" stroke-width="4" marker-end="url(#arrow)"/><path d="M620 255H688" stroke="#746C8C" stroke-width="4" marker-end="url(#arrow)"/><path d="M930 255H998" stroke="#746C8C" stroke-width="4" marker-end="url(#arrow)"/><path d="M1240 255H1278" stroke="#746C8C" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1405 330V410C1405 455 1375 475 1330 475H535C490 475 470 455 470 420V345" fill="none" stroke="#D45A5A" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <rect x="795" y="444" width="285" height="48" rx="24" fill="#FFF0F0"/><text x="938" y="476" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" font-weight="700" fill="#A93838">发现 Bug → 回流 Developer 修复</text>

  <g filter="url(#shadow)"><rect x="470" y="545" width="660" height="100" rx="26" fill="url(#hero)"/><text x="800" y="585" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">Release Waker：发布准备</text><text x="800" y="619" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" fill="#EEE9FF">创建发布 PR → 人工合并 → Tag / GitHub Release → 关闭迭代</text></g>
  <path d="M1405 330V595H1142" fill="none" stroke="#6B4FE0" stroke-width="4" marker-end="url(#arrowPurple)"/>
</svg>
