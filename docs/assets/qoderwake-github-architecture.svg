<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">QoderWake 与 GitHub 自动化研发架构</title>
  <desc id="desc">GitHub 保存研发事实并产生事件，GitHub Actions 完成事件治理与凭据注入，QoderWake API 自动任务唤醒四个职责独立的 Waker。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F6FF"/><stop offset="1" stop-color="#F4FAFF"/></linearGradient>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#241A45" flood-opacity=".12"/></filter>
    <marker id="a2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#6C6285"/></marker>
  </defs>
  <rect width="1600" height="850" rx="32" fill="url(#bg2)"/>
  <text x="80" y="76" font-family="Arial,'PingFang SC',sans-serif" font-size="36" font-weight="700" fill="#201A36">QoderWake × GitHub 自动化研发架构</text>
  <text x="80" y="116" font-family="Arial,'PingFang SC',sans-serif" font-size="20" fill="#6E6880">GitHub 保留研发事实，Actions 负责事件治理，QoderWake 承担智能执行</text>

  <rect x="80" y="155" width="1440" height="165" rx="28" fill="#FFFFFF" filter="url(#s2)"/>
  <text x="115" y="198" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#655D78">DEVOPS 控制面</text>
  <g font-family="Arial,'PingFang SC',sans-serif">
    <rect x="120" y="220" width="300" height="70" rx="18" fill="#F0EDFF"/><text x="270" y="250" text-anchor="middle" font-size="23" font-weight="700" fill="#37275D">GitHub 事实源</text><text x="270" y="276" text-anchor="middle" font-size="16" fill="#675F76">Milestone · Issue · PR</text>
    <rect x="500" y="220" width="300" height="70" rx="18" fill="#EAF5FF"/><text x="650" y="250" text-anchor="middle" font-size="23" font-weight="700" fill="#214E7C">Actions 事件路由</text><text x="650" y="276" text-anchor="middle" font-size="16" fill="#5D6D7E">过滤 · 幂等 · 最小上下文</text>
    <rect x="880" y="220" width="300" height="70" rx="18" fill="#FFF3DA"/><text x="1030" y="250" text-anchor="middle" font-size="23" font-weight="700" fill="#7B5000">Secret 凭据库</text><text x="1030" y="276" text-anchor="middle" font-size="16" fill="#78694F">PAT · Waker API URL</text>
    <rect x="1260" y="220" width="220" height="70" rx="18" fill="#E9F8EF"/><text x="1370" y="250" text-anchor="middle" font-size="23" font-weight="700" fill="#245C3C">CI 质量门禁</text><text x="1370" y="276" text-anchor="middle" font-size="16" fill="#5C7466">test · lint</text>
  </g>
  <path d="M420 255H488" stroke="#6C6285" stroke-width="4" marker-end="url(#a2)"/><path d="M800 255H868" stroke="#6C6285" stroke-width="4" marker-end="url(#a2)"/><path d="M1180 255H1248" stroke="#6C6285" stroke-width="4" marker-end="url(#a2)"/>

  <rect x="240" y="380" width="1120" height="100" rx="28" fill="#6146D8" filter="url(#s2)"/>
  <text x="800" y="420" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">QoderWake API 自动任务</text>
  <text x="800" y="453" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="18" fill="#EEE9FF">POST + Authorization: Bearer PAT · 隔离会话 · wakeSessionUniqueId</text>
  <path d="M650 320V365" stroke="#6C6285" stroke-width="4" marker-end="url(#a2)"/><path d="M1030 320V365" stroke="#6C6285" stroke-width="4" marker-end="url(#a2)"/>

  <text x="115" y="548" font-family="Arial,'PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#655D78">AI 执行面</text>
  <g filter="url(#s2)" font-family="Arial,'PingFang SC',sans-serif">
    <rect x="120" y="575" width="300" height="125" rx="24" fill="#FFFFFF"/><text x="270" y="620" text-anchor="middle" font-size="24" font-weight="700" fill="#201A36">Release Waker</text><text x="270" y="653" text-anchor="middle" font-size="17" fill="#665F74">迭代分支 · 发布 PR · Tag</text><text x="270" y="681" text-anchor="middle" font-size="15" fill="#8A8396">独立 BIBLE / API Task</text>
    <rect x="475" y="575" width="300" height="125" rx="24" fill="#FFFFFF"/><text x="625" y="620" text-anchor="middle" font-size="24" font-weight="700" fill="#201A36">Developer Waker</text><text x="625" y="653" text-anchor="middle" font-size="17" fill="#665F74">需求开发 · 自测 · 创建 PR</text><text x="625" y="681" text-anchor="middle" font-size="15" fill="#8A8396">独立 BIBLE / API Task</text>
    <rect x="830" y="575" width="300" height="125" rx="24" fill="#FFFFFF"/><text x="980" y="620" text-anchor="middle" font-size="24" font-weight="700" fill="#201A36">Reviewer Waker</text><text x="980" y="653" text-anchor="middle" font-size="17" fill="#665F74">读取 Diff · 独立测试 · 结论</text><text x="980" y="681" text-anchor="middle" font-size="15" fill="#8A8396">独立 BIBLE / API Task</text>
    <rect x="1185" y="575" width="300" height="125" rx="24" fill="#FFFFFF"/><text x="1335" y="620" text-anchor="middle" font-size="24" font-weight="700" fill="#201A36">Tester Waker</text><text x="1335" y="653" text-anchor="middle" font-size="17" fill="#665F74">独立验收 · Bug 证据回流</text><text x="1335" y="681" text-anchor="middle" font-size="15" fill="#8A8396">独立 BIBLE / API Task</text>
  </g>
  <path d="M800 480V525H270V560" fill="none" stroke="#6C6285" stroke-width="4" marker-end="url(#a2)"/><path d="M800 480V525H625V560" fill="none" stroke="#6C6285" stroke-width="4" marker-end="url(#a2)"/><path d="M800 480V560" stroke="#6C6285" stroke-width="4" marker-end="url(#a2)"/><path d="M800 480V525H1335V560" fill="none" stroke="#6C6285" stroke-width="4" marker-end="url(#a2)"/>

  <rect x="120" y="750" width="1365" height="58" rx="20" fill="#252035"/>
  <text x="802" y="786" text-anchor="middle" font-family="Arial,'PingFang SC',sans-serif" font-size="19" fill="#FFFFFF">事实闭环：代码 · PR · Review · Bug · 测试证据 · Release 统一回写 GitHub</text>
  <path d="M270 700V735M625 700V735M980 700V735M1335 700V735" stroke="#6C6285" stroke-width="3"/>
  <path d="M120 779H48V255H105" fill="none" stroke="#6C6285" stroke-width="4" marker-end="url(#a2)"/>
</svg>
